name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            working-directory: src
            command: npm run check
          - name: Web
            working-directory: web
            command: npm run build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run check
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.command }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger API deploy
        env:
          API_DEPLOY_WEBHOOK_URL: ${{ secrets.API_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$API_DEPLOY_WEBHOOK_URL" ]; then
            echo "API_DEPLOY_WEBHOOK_URL is not configured; skipping API deploy."
            exit 0
          fi

          curl -fsS -X POST "$API_DEPLOY_WEBHOOK_URL"

      - name: Trigger web deploy
        env:
          WEB_DEPLOY_WEBHOOK_URL: ${{ secrets.WEB_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEB_DEPLOY_WEBHOOK_URL" ]; then
            echo "WEB_DEPLOY_WEBHOOK_URL is not configured; skipping web deploy."
            exit 0
          fi

          curl -fsS -X POST "$WEB_DEPLOY_WEBHOOK_URL"
