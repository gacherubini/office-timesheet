# Único workflow do repo. PR e push em main: check + testes.
# Push em main: deploy da API e do web no Fly. Sem webhooks.
name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            working-directory: src
            command: npm run check
          - name: Web
            working-directory: web
            command: npm run build
          - name: Web Tests
            working-directory: web
            command: npm test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run check
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.command }}

  api-tests:
    name: API Tests (cronômetro & ganhos)
    runs-on: ubuntu-latest

    # Postgres num container que o GitHub sobe e derruba automaticamente.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: office_timesheet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/office_timesheet_test
      JWT_SECRET: test-secret-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Run tests (unit + integração)
        working-directory: src
        run: npm test

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [ci, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        working-directory: src
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: flyctl deploy --remote-only --app office-timesheet-api

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [ci, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Web
        working-directory: web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: flyctl deploy --remote-only --app office-timesheet-web --build-arg VITE_API_URL=https://office-timesheet-api.fly.dev
