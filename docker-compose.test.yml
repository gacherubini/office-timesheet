services:
  postgres-test:
    image: postgres:16-alpine
    container_name: office-timesheet-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: office_timesheet_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
    # tmpfs: banco em memória, descartável — mais rápido e sem volume persistente.
    tmpfs:
      - /var/lib/postgresql/data
